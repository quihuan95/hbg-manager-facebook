<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The HBG • Content Studio</title>
  <link rel="stylesheet" href="vendor/simplebar.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-titlebar" id="appTitlebar">
    <div class="titlebar-drag-region">
      <span class="titlebar-mark">H</span>
      <strong>THE HBG</strong>
      <i aria-hidden="true"></i>
      <span>Content Studio</span>
    </div>
    <div class="window-controls" aria-label="Điều khiển cửa sổ">
      <button type="button" id="windowMinimize" aria-label="Thu nhỏ" title="Thu nhỏ"><span></span></button>
      <button type="button" id="windowMaximize" aria-label="Phóng to" title="Phóng to"><span></span></button>
      <button type="button" id="windowClose" aria-label="Đóng" title="Đóng"><span></span></button>
    </div>
  </div>
  <aside>
    <a class="brand" href="#publishing" aria-label="The HBG Content Studio">
      <img src="assets/the-hbg-logo.png" alt="The HBG" />
    </a>
    <div class="nav-scroll" data-simplebar data-simplebar-auto-hide="false">
      <nav id="nav"></nav>
    </div>
    <div class="sidefoot">
      <span class="avatar">M</span>
      <div>Minh Phạm<small>Workspace quản trị</small></div>
    </div>
  </aside>
  <main>
    <header>
      <div>
        <h1 id="title">Tạo bài</h1>
        <div class="header-meta">
          <span>THE HBG CONTENT STUDIO</span>
          <i aria-hidden="true"></i>
          <span id="appVersion">v...</span>
          <i aria-hidden="true"></i>
          <span>Asia/Ho_Chi_Minh</span>
          <i aria-hidden="true"></i>
          <span>Phase 1</span>
        </div>
      </div>
    </header>
    <div id="viewScroll" data-simplebar data-simplebar-auto-hide="false">
      <div id="view"></div>
    </div>
  </main>
  <dialog id="modal">
    <form id="modalForm">
      <div class="modalhead">
        <h2 id="modalTitle"></h2>
        <button type="button" id="closeModal" class="icon-button" aria-label="Đóng"><i data-lucide="x"></i></button>
      </div>
      <div id="modalScroll" data-simplebar data-simplebar-auto-hide="false">
        <div id="modalBody"></div>
      </div>
      <div class="modalfoot">
        <button type="button" id="cancelModal">Hủy</button><button class="primary" type="submit"><i data-lucide="save"></i>Lưu</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="vendor/lucide.min.js"></script>
  <script src="vendor/simplebar.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
