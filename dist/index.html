<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The HBG • Content Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <aside>
    <a class="brand" href="#create_posts" aria-label="The HBG Content Studio">
      <img src="assets/the-hbg-logo.png" alt="The HBG" />
    </a>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <span class="avatar">M</span>
      <div>Minh Phạm<small>Workspace quản trị</small></div>
    </div>
  </aside>
  <main>
    <header>
      <div>
        <span class="eyebrow">CONTENT OPERATIONS</span>
        <h1 id="title">Tạo bài</h1>
      </div>
    </header>
    <div id="view"></div>
    <footer>
      <span>THE HBG CONTENT STUDIO · <span id="appVersion">v...</span></span>
      <span>Asia/Ho_Chi_Minh · Phase 1</span>
    </footer>
  </main>
  <dialog id="modal">
    <form id="modalForm">
      <div class="modalhead">
        <h2 id="modalTitle"></h2>
        <button type="button" id="closeModal" class="icon-button" aria-label="Đóng"><i data-lucide="x"></i></button>
      </div>
      <div id="modalBody"></div>
      <div class="modalfoot">
        <button type="button" id="cancelModal">Hủy</button><button class="primary" type="submit"><i data-lucide="save"></i>Lưu</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="vendor/lucide.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
